<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realia – Analitikos įrankis</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: control panel left (sticky on desktop), results right; stacks on phone. Data-tool treatment, tabular numerals everywhere. */
:root{
  --bg:#e3e1de; --panel:#f1efec; --fg:#111111; --muted:#6a655e; --line:#cdc8c2;
  --accent:#4f5440; --accent-fg:#f1efec; --accent-soft:#d6d6c6;
  --warn:#8a7a0e; --warn-soft:#ece6bd; --good:#4f5440;
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Mono","Courier New",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111111; --panel:#1b1a18; --fg:#ece8e2; --muted:#9d978e; --line:#33302b;
  --accent:#b8a21a; --accent-fg:#111111; --accent-soft:#2b2815; --warn:#d1bb3a; --warn-soft:#2e2a10; --good:#9aa27a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111111; --panel:#1b1a18; --fg:#ece8e2; --muted:#9d978e; --line:#33302b;
  --accent:#b8a21a; --accent-fg:#111111; --accent-soft:#2b2815; --warn:#d1bb3a; --warn-soft:#2e2a10; --good:#9aa27a; color-scheme:dark }
.logo{display:block;height:34px;width:auto}.logo.l{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.d{display:none}:root:not([data-theme="light"]) .logo.l{display:block}}
:root[data-theme="dark"] .logo.d{display:none}:root[data-theme="dark"] .logo.l{display:block}
.brand{display:flex;flex-direction:column;gap:6px}
.brand .sub{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted)}
.panel,button.primary,input[type=text],input[type=number],select,button.ghost,.tile,.tablewrap,.sugg ul{border-radius:2px}
button.plus{width:34px;height:34px;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.brandrow{display:flex;align-items:center;gap:14px}
header .who{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--muted)}
#login{padding:5px 12px;font-size:11px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:2px;background:transparent;cursor:pointer;color:var(--fg)}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:14px 16px}
.leaflet-popup-content a{color:var(--accent)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted);font-size:20px;padding:6px 8px 0 0}
.leaflet-control-layers{background:var(--panel)!important;color:var(--fg);border:1px solid var(--line)!important;border-radius:2px!important;box-shadow:none!important;font-family:var(--mono);font-size:11px}
.leaflet-control-layers label{color:var(--fg);font-size:11px;margin:0}
.leaflet-bar a{background:var(--panel)!important;color:var(--fg)!important;border-color:var(--line)!important}
.leaflet-control-attribution{font-size:9px;background:transparent!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-control-scale-line{font-family:var(--mono);font-size:10px;background:transparent;color:var(--fg);border-color:var(--fg)}
.pt{font-size:12px;border-collapse:collapse;margin-top:8px}.pt td{padding:2px 12px 2px 0;vertical-align:top}.pt td:first-child{color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;padding-top:4px}
.pt select{width:auto;padding:1px 4px;font-size:12px}
.ptitle{font-family:var(--font);font-weight:600;font-size:14px;letter-spacing:-.01em}
.psub{color:var(--muted);font-size:12px;margin-top:2px}
.pact{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.ebtn,.delbtn{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:2px;cursor:pointer;background:transparent}
.ebtn{border:1px solid var(--accent);color:var(--accent)}.ebtn:hover{background:var(--accent);color:var(--accent-fg)}
.delbtn{border:1px solid #a84a3a;color:#a84a3a;margin:0}.delbtn:hover{background:#a84a3a;color:#fff}
h2,.tiles .t{font-family:var(--mono)}
*{box-sizing:border-box}input[type=checkbox]{accent-color:var(--accent)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}

h2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:16px 0 10px;padding-top:14px;border-top:1px solid var(--line)}h2:first-child{margin-top:0;padding-top:0;border:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
header .meta{color:var(--warn);font-size:12px;font-family:var(--mono)}header .meta:empty{display:none}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:16px}
.controls{position:sticky;top:12px}
@media (max-width:820px){.controls{position:static}}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.01em}
.field{margin-bottom:12px}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=number],select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:2px;background:var(--bg);font-size:13px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.check input{width:auto;margin:0}
button.primary{width:100%;padding:10px;border:0;border-radius:2px;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
button.ghost{padding:6px 12px;border:1px solid var(--line);border-radius:2px;background:transparent;cursor:pointer;font-size:11px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase}
.sugg{position:relative}
.sugg ul{position:absolute;z-index:5;left:0;right:0;top:100%;margin:2px 0 0;padding:4px 0;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sugg li{padding:6px 10px;cursor:pointer;font-size:13px}
.sugg li:hover,.sugg li.active{background:var(--accent-soft)}
.sugg li small{display:block;color:var(--muted);font-size:11px}
.center{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px;word-break:break-word}
[hidden]{display:none!important}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:12px 14px}
#tiles2 .tile{border-left:3px solid var(--accent)}
#tiles .tile{border-left:3px solid #3f5a80}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #tiles .tile{border-left-color:#7f9cc4}}
:root[data-theme="dark"] #tiles .tile{border-left-color:#7f9cc4}
.tile .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono)}
.tile .v{font-family:var(--mono);font-size:22px;font-weight:400;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--muted);margin-top:2px}.tile .s:empty{display:none}
.results{min-width:0}
.split{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}.split>*{min-width:0;max-width:100%}.results{overflow-x:clip}
.leaflet-container{font:inherit}
.leaflet-popup-content{font-size:12px;line-height:1.4}
.lmark{background:transparent;border:0}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tablewrap th,.tablewrap td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:normal;overflow-wrap:anywhere;vertical-align:top}
.tablewrap table{table-layout:auto;width:100%;font-size:12px}
.tablewrap td.num,.tablewrap th,.tablewrap .pill,.tablewrap td:nth-child(1),.tablewrap td:nth-child(2),.tablewrap td:nth-child(3){white-space:nowrap}
.tablewrap td.adr{width:30%}
.tablewrap td:last-child{min-width:150px}
.ebtn,.delbtn{white-space:nowrap}
.tablewrap .pact,.tablewrap .admin-only{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:12px}
th{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel);font-weight:400}
th.sorted{color:var(--accent)}
.tablewrap tr:hover td{background:var(--accent-soft)}
td.adr{white-space:normal;min-width:140px}
.pill{display:inline-block;padding:1px 7px;border-radius:2px;font-size:10px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.pill.subj{border-color:var(--accent);color:var(--accent)}
.pill.mano{border-color:#b8a21a;color:#b8a21a;background:rgba(184,162,26,.12)}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.legend{display:flex;gap:14px;font-size:10px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.dia{border-radius:1px;transform:rotate(45deg) scale(.85)}
.skd{width:16px;height:16px;transform:rotate(45deg);border:2px solid #fff;box-shadow:0 1px 4px #0008;border-radius:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.admin-only{display:none!important}body.admin .admin-only{display:inline-block!important}body.admin button.plus.admin-only{display:flex!important}body.admin div.admin-only{display:flex!important}</style></head><body>

    sklLayer.clearLayers(); const on=$('skl').checked; $('sklwrap').hidden=!on; $('tiles3').hidden=!on; if(!on) return;
    const list=[]; const bnds=map.getBounds();
    for(const k of K){ if(!$(SKID[k.busena]||'sk_pas').checked) continue; if(k.lat!=null){ L.marker([k.lat,k.lon],{pane:'res',zIndexOffset:500,icon:L.divIcon({className:'',html:`<div class="skd" style="background:${SKC[k.busena]||'#555'}"></div>`,iconSize:[20,20],iconAnchor:[10,10]})}).bindPopup(skPopup(k),{maxWidth:340}).addTo(sklLayer); if(!bnds.contains([k.lat,k.lon])) continue; } list.push(k); }
    list.sort((a,b)=>SKB.indexOf(a.busena)-SKB.indexOf(b.busena)||(b.atnaujinta||'').localeCompare(a.atnaujinta||''));
    const vk=list.map(k=>+k.vnt_kaina).filter(x=>x>0); const pl=list.map(k=>+k.plotas).filter(x=>x>0); const cnt=SKB.map(b=>`${list.filter(k=>k.busena===b).length} ${b.toLowerCase()}`).join(' · ');
    $('tiles3').innerHTML=[['Sklypai ir projektai',fmt(list.length),cnt],['Mediana €/a',vk.length?fmt(quant(vk,.5)):'–',''],['Bendras plotas',pl.length?fmtA(pl.reduce((a,b)=>a+b,0)):'–',''],['Pasiūlymų suma',list.some(k=>k.pasiulymo_kaina)?fmt(list.reduce((a,k)=>a+(+k.pasiulymo_kaina||0),0))+' €':'–','']].map(([k,v,s2])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s2}</div></div>`).join('');
    $('sklwrap').innerHTML=list.length?`<table><thead><tr><th>Būsena</th><th class="adr">Sklypas</th><th>Kadastro Nr.</th><th class="num">Plotas</th><th class="num">Kaina €</th><th class="num">€/a</th><th>Pardavėjas</th><th>Planas</th></tr></thead><tbody>${list.map(k=>`<tr><td><span class="pill" style="border-color:${SKC[k.busena]};color:${SKC[k.busena]}">${k.busena}</span></td><td class="adr"><b>${k.pavadinimas||k.adresas||'–'}</b>${k.pavadinimas&&k.adresas?`<br><small style="color:var(--muted)">${k.adresas}</small>`:''}${k.paskirtis?`<br><small style="color:var(--muted)">${k.paskirtis}</small>`:''}${k.lat==null?'<br><small style="color:var(--warn)">be koordinačių</small>':''}</td><td style="font-family:var(--mono);font-size:12px">${k.kadastro_nr||'–'}</td><td class="num">${fmtA(k.plotas!=null?+k.plotas:null)}</td><td class="num">${fmt(k.pasiulymo_kaina)}</td><td class="num">${fmt(k.vnt_kaina)}</td><td>${k.pardavejas||'–'}${k.pardavejo_kontaktai?`<br><small style="color:var(--muted)">${k.pardavejo_kontaktai}</small>`:''}</td><td>${k.planas_url?`<a href="#" onclick="__plan('${k.planas_url}');return false">Planas</a>`:'–'}<div class="admin-only"><button class="delbtn" style="border-color:var(--accent);color:var(--accent)" onclick="__edit('k',${k.id})">Redaguoti</button> <button class="delbtn" onclick="__del('k',${k.id})">Trinti</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Sklypų šioje žemėlapio dalyje nėra. Pridėkite per „+“ prie logotipo.</div>';
  }
  const _draw=draw; draw=function(){ _draw(); drawVyst(); drawSkl(); };
  ['skl','sk_pas','sk_der','sk_dd','sk_atm'].forEach(id=>$(id).addEventListener('change',drawSkl));
  $('vyst').addEventListener('change',drawVyst);
  $('vert').addEventListener('change',()=>{ $('tiles').hidden=!$('vert').checked; if($('vert').checked) allLayer.addTo(map); else map.removeLayer(allLayer); });
  $('vert').dispatchEvent(new Event('change'));


  // pradinė būsena: Kaunas taip, kad tilptų visi Realia projektai (jei jų nėra – centras)
  { const rp=S.filter(x=>x.realia&&x.lat!=null); const fit=()=>{ map.invalidateSize(); if(rp.length){ const b=L.latLngBounds(rp.map(x=>[x.lat,x.lon])); b.extend([54.8972,23.9120]); map.fitBounds(b,{padding:[30,30],maxZoom:13}); } else map.setView([54.8972,23.9120],13); }; fit(); setTimeout(fit,400); } run();
})();
</script></body></html>
