    const need=[]; for(const e of Z.E) for(const f of (e.failai||[])) if(f.itemId&&f.driveId&&!Z.thumbs[f.itemId]) need.push(f); if(!need.length) return;
    let gone=false; for(const f of need.slice(0,60)){ try{ const j=await graph(`/drives/${f.driveId}/items/${f.itemId}/thumbnails/0?$select=medium,large`); const u=j.medium?.url; if(u){ Z.thumbs[f.itemId]=u; document.querySelectorAll(`.zp[title="${CSS.escape(f.name)}"] img`).forEach(img=>{ img.src=u; img.style.display=''; }); } }catch(e){ if(isAdmin()&&/itemNotFound/i.test(e.message||'')&&!/accessDenied|403/i.test(e.message||'')){ f._gone=true; gone=true; } } }
    if(gone){ for(const e of Z.E){ const before=(e.failai||[]).length; const keep=(e.failai||[]).filter(f=>!f._gone); if(keep.length!==before){ e.failai=keep; try{ await api('zurnalas?id=eq.'+e.id,{method:'PATCH',headers:{prefer:'return=minimal'},body:JSON.stringify({failai:keep,atnaujinta:new Date().toISOString()})}); }catch(err){} } } toast('OneDrive ištrintos bylos pašalintos iš žurnalo.'); draw(); } }
  function viewPhoto(e,f,i){ const ov=document.createElement('div'); ov.className='pv'; ov.innerHTML=`<div class="pvh"><span class="pvn"><b>${esc(f.name)}</b><small> · ${fdl(e.data)}</small></span><span class="pva"><a class="ghost" href="${esc(f.webUrl||'#')}" target="_blank" title="Atidaryti OneDrive">${ic('open')}</a><button class="ghost" id="pv_x">${ic('close')}</button></span></div><div class="pvb"><div class="note" style="padding:30px">Kraunama…</div></div>`; document.body.appendChild(ov); const close=()=>ov.remove(); ov.querySelector('#pv_x').onclick=close; ov.onclick=ev=>{ if(ev.target===ov) close(); };
    ov.querySelector('.pva').insertAdjacentHTML('afterbegin',`<button class="ghost" id="pv_sh" title="Dalintis">${ic('share')}</button>`); ov.querySelector('#pv_sh').onclick=()=>shareFiles([f],e.pavadinimas||'');
    (async()=>{ try{ const j=await graph(`/drives/${f.driveId}/items/${f.itemId}`); let u=j['@microsoft.graph.downloadUrl']; if(!u){ try{ const th=await graph(`/drives/${f.driveId}/items/${f.itemId}/thumbnails/0?$select=large`); u=th.large?.url; }catch(e){} } if(!u) throw new Error('Nepavyko gauti bylos nuorodos'); const mt=j.file?.mimeType||''; if(/^video\//.test(mt)||isVid(f.name)) ov.querySelector('.pvb').innerHTML=`<video src="${u}" controls autoplay playsinline style="max-width:100%;max-height:100%;background:#000;border-radius:6px"></video>`; else if(/^image\//.test(mt)||isImg(f.name)) ov.querySelector('.pvb').innerHTML=`<img src="${u}" alt="">`; else ov.querySelector('.pvb').innerHTML=`<div class="note" style="padding:30px;text-align:center"><a class="primary" style="text-decoration:none;padding:10px 18px" href="${u}" download="${esc(f.name)}">Atsisiųsti ${esc(f.name)}</a></div>`; }catch(err){ if(isAdmin()&&/itemNotFound/i.test(err.message||'')&&!/accessDenied|403/i.test(err.message||'')){ e.failai=(e.failai||[]).filter(x=>x.itemId!==f.itemId); try{ await api('zurnalas?id=eq.'+e.id,{method:'PATCH',headers:{prefer:'return=minimal'},body:JSON.stringify({failai:e.failai})}); }catch(x){} ov.remove(); toast('Byla ištrinta OneDrive – pašalinta iš žurnalo.'); draw(); return; } ov.querySelector('.pvb').innerHTML=`<div class="note" style="padding:30px;color:var(--bad)">${esc(err.message)}</div>`; } })(); }
  // ---- Dalintis (Web Share API – telefone į WhatsApp/Messenger/Mail; kompiuteryje – nuorodos)
  async function fetchBlob(f){ const j=await graph(`/drives/${f.driveId}/items/${f.itemId}`); const u=j['@microsoft.graph.downloadUrl']; if(!u) throw new Error('nėra nuorodos'); const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status); return new File([await r.blob()],f.name,{type:j.file?.mimeType||r.headers.get('content-type')||'application/octet-stream'}); }
  async function shareFiles(files,text){ const p=proj(); const title=(p?p.pavadinimas+' – ':'')+'Žurnalas'; const links=files.map(f=>f.webUrl).filter(Boolean).join('\n');
    if(navigator.share){ try{ const fl=[]; if(navigator.canShare){ for(const f of files.slice(0,10)){ try{ const bf=await fetchBlob(f); if(navigator.canShare({files:[bf]})) fl.push(bf); }catch(e){} } } if(fl.length&&navigator.canShare({files:fl})){ await navigator.share({title,text:text||undefined,files:fl}); return; } await navigator.share({title,text:(text?text+'\n':'')+links}); return; }catch(e){ if(e.name==='AbortError') return; } }
    try{ await navigator.clipboard.writeText((text?text+'\n':'')+links); toast('Nuorodos nukopijuotos – įklijuokite į laišką ar žinutę.'); }catch(e){ alert(links); } }
  async function shareEntry(e){ const txt=[e.pavadinimas,e.tekstas,fdl(e.data)].filter(Boolean).join('\n'); const st=$('zstat'); if((e.failai||[]).length) st.textContent='Ruošiu bylas dalinimuisi…'; try{ await shareFiles(e.failai||[],txt); } finally{ st.textContent=''; } }

  // ---- Kamera / įkėlimas
  async function addPhotos(files){ const p=proj(); if(!p||!files.length) return; const target=Z.target?Z.E.find(x=>x.id===Z.target):null; Z.target=null; const date=target?target.data:ymd(new Date()); const st=$('zstat'); st.textContent=`Keliu 0/${files.length}…`; Z.busy=true; $('zbtns').classList.add('busy');
    try{ const fo=await dayFolder(p,date); const done=[]; let n=0;
      for(const f of files){ n++; st.textContent=`Keliu ${n}/${files.length} · ${f.name} (${(f.size/1048576).toFixed(1)} MB)…`; const now=new Date(); const ext=(f.name.split('.').pop()||'jpg').toLowerCase(); const nm=`${date}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}_${name(ME)}.${ext}`; const it=await uploadFile(fo.d,fo.id,f,nm); if(it) done.push({name:it.name||nm,itemId:it.id,driveId:fo.d,webUrl:it.webUrl,size:it.size||f.size,thumb:''}); }
      // vienas įrašas per dieną ir autorių – nuotraukos pridedamos
      let e=target||Z.E.find(x=>x.data===date&&x.tipas==='foto'&&x.autorius===ME); if(e){ const failai=[...(e.failai||[]),...done]; const j=await api('zurnalas?id=eq.'+e.id,{method:'PATCH',headers:{prefer:'return=representation'},body:JSON.stringify({failai,atnaujinta:new Date().toISOString()})}); Object.assign(e,j[0]); } else { const j=await api('zurnalas',{method:'POST',headers:{prefer:'return=representation'},body:JSON.stringify({projektas_id:p.id,data:date,tipas:'foto',failai:done,autorius:ME})}); Z.E.unshift(j[0]); }
      st.textContent=''; toast(`Įkelta nuotraukų: ${done.length}`); draw(); }
    catch(e){ st.textContent=''; alert('Nepavyko: '+odErr(e,p)); } finally{ Z.busy=false; $('zbtns').classList.remove('busy'); } }
  function penEntry(edit){ const p=proj(); if(!p) return; const m=modal((edit?'Redaguoti įrašą · ':'Įrašas · ')+esc(p.pavadinimas),`<div class="note" style="margin-bottom:8px">${fdl(edit?edit.data:ymd(new Date()))}</div><div class="kf"><label>Pavadinimas</label><input type="text" id="z_p" value="${esc(edit?.pavadinimas||'')}" placeholder="Pvz.: Pamatų betonavimas"></div><div class="kf"><label>Aprašymas</label><textarea id="z_t" rows="5" placeholder="Kas įvyko, kas dalyvavo, kiekiai, pastabos…">${esc(edit?.tekstas||'')}</textarea></div>`,`<button class="ghost" id="z_x">Atšaukti</button><button class="primary" id="z_ok" style="width:auto;padding:9px 18px">${edit?'Išsaugoti':'Įrašyti'}</button>`);
    m.querySelector('#z_x').onclick=()=>m.remove(); m.querySelector('#z_ok').onclick=async()=>{ const t=m.querySelector('#z_t').value.trim(), pv=m.querySelector('#z_p').value.trim(), d=edit?edit.data:ymd(new Date()); if(!t&&!pv){ m.querySelector('#mmsg').textContent='Įveskite pavadinimą arba aprašymą.'; return; } try{ if(edit){ const j=await api('zurnalas?id=eq.'+edit.id,{method:'PATCH',headers:{prefer:'return=representation'},body:JSON.stringify({pavadinimas:pv||null,tekstas:t||null,atnaujinta:new Date().toISOString()})}); Object.assign(edit,j[0]); } else { const j=await api('zurnalas',{method:'POST',headers:{prefer:'return=representation'},body:JSON.stringify({projektas_id:p.id,data:d,tipas:'irasas',pavadinimas:pv||null,tekstas:t||null,autorius:ME})}); Z.E.unshift(j[0]); } Z.E.sort((a,b)=>b.data.localeCompare(a.data)||String(b.sukurta).localeCompare(String(a.sukurta))); m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } }; }
  function msBtn(){ let b=$('zms'); if(!b){ b=document.createElement('button'); b.id='zms'; b.className='zbig'; b.innerHTML='Prisijungti prie Microsoft (OneDrive)'; $('zbtns').after(b); b.onclick=async()=>{ b.disabled=true; b.textContent='Jungiu…'; try{ await msToken(true); }catch(e){ b.disabled=false; b.textContent='Prisijungti prie Microsoft (OneDrive)'; alert(e.message); } }; } b.style.display=msAcc?'none':''; }
  // ---- valdymas
  $('zsel').onchange=()=>{ Z.pid=+$('zsel').value||null; localStorage.setItem('tv_zur_pid',Z.pid||''); loadEntries(); };
  const camIn=$('zcam_in'); if(!isMobile()) camIn.removeAttribute('capture');
  $('zcam').onclick=()=>{ if(Z.busy) return; if(!msAcc){ $('zms').click(); return; } camIn.value=''; camIn.click(); }; camIn.onchange=()=>addPhotos([...camIn.files]);
  $('zup').onclick=()=>{ if(!msAcc){ $('zms').click(); return; } const i=$('zup_in'); i.value=''; i.click(); }; $('zup_in').onchange=()=>addPhotos([...$('zup_in').files]);
  $('zpen').onclick=()=>penEntry();
  $('meta').textContent='';
  try{ Z.P=await api('projektai?select=id,pavadinimas,onedrive,busena&order=busena,pavadinimas'); Z.P.sort((a,b)=>(/realia/i.test(b.pavadinimas)-/realia/i.test(a.pavadinimas))||String(a.busena||'').localeCompare(String(b.busena||''),'lt')||a.pavadinimas.localeCompare(b.pavadinimas,'lt')); }catch(e){ toast('Projektų nepavyko įkelti: '+e.message); }
  if(!Z.pid&&Z.P.length===1) Z.pid=Z.P[0].id;
  draw(); await loadEntries();
  try{ await msInit(); }catch(e){ console.warn(e); } msBtn(); setTimeout(()=>{ autoResync().catch(()=>{}); },1500);

})();
