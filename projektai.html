  function editBar(p,r){ const adm=isAdmin(); const nrOf=ids=>ids.map(i=>(M.find(m=>m.id===i)||{}).nr).filter(Boolean).join(', ');
    const m=modal(`${esc(r.nr)} ${esc(r.darbas)}`,`<div class="g">${SEL('st','Būsena',MST,r.st)}<div class="check" style="align-self:end"><input type="checkbox" id="f_ms" ${r.gaire?'checked':''}><label for="f_ms" style="margin:0">◆ Gairė (milestone – viena data)</label></div>${F('ds','Pradžia','date',r.pr||'')}${F('de','Pabaiga','date',r.pb||'')}${F('pre','Pirmtakai (numeriai, pvz. 2.3, 2.5 – darbas prasidės po jų)','text',nrOf(r.preds),'w')}${F('grp','Grupė (susiję darbai rodomi kartu Gantt grafike)','text',r.grupe||'','w')}</div><div class="note">Etapas: ${esc(r.etapas)} · vykdo ${PN[r.vk]}${adm?' · pakeitus datas pasekėjai perplanuojami automatiškai':' · grafiką keičia tik administratorius'}</div>`,`<button class="ghost" id="mc">Atšaukti</button><button class="primary" id="ms" style="width:auto;padding:10px 22px">Išsaugoti</button>`);
    if(!adm) ['f_ds','f_de','f_pre','f_grp','f_ms'].forEach(id=>m.querySelector('#'+id).disabled=true);
    m.querySelector('#f_ms').onchange=e=>{ if(e.target.checked) m.querySelector('#f_de').value=m.querySelector('#f_ds').value; };
    m.querySelector('#mc').onclick=()=>m.remove();
    m.querySelector('#ms').onclick=async()=>{ const st=gv(m,'st'); let ok=true; if(st!==r.st) ok=await savePM(p.id,r.id,stPatch(st)); if(!ok) return;
      if(adm){ let a=gv(m,'ds')||null, b=gv(m,'de')||null; const ms=m.querySelector('#f_ms').checked; if(a&&!b) b=a; if(a&&b&&b<a) b=a; if(ms&&a) b=a;
        const nrs=gv(m,'pre').split(/[,;\s]+/).filter(Boolean); const ids=[]; for(const n of nrs){ const mm=M.find(z=>z.nr===n); if(!mm){ m.querySelector('#mmsg').textContent='Nerastas darbas nr. '+n; return; } if(mm.id===r.id){ m.querySelector('#mmsg').textContent='Darbas negali būti savo pirmtakas.'; return; } const rows=rowsOf(p); if(isAncestor(rows,r.id,mm.id)){ m.querySelector('#mmsg').textContent='Ciklas per darbą '+n; return; } ids.push(mm.id); }
        ok=await applyDates(p,new Map([[r.id,{pradzia:a,pabaiga:b,gaire:ms,pirmtakai:ids,grupe:gv(m,'grp')||null}]])); }
      if(ok){ m.remove(); draw(); } }; }
  // ---- Biudžetas (Notion veidrodis)
  const FZ=['Analizė','Projektavimas','Pasiruošimas statybai','Statyba','Dokumentai']; const bzF={show:'all'};
  const eur=v=>v==null?'':Math.round(+v).toLocaleString('lt-LT')+' €';
  const BSC={'Nepradėtas':'var(--muted)','Vyksta':'#BAA920','Atlikta':'#5E5C4A'};
  function drawBudget(p){ const src=NS.filter(n=>n.projektas_id===p.id); const all=B.filter(b=>b.projektas_id===p.id);
    const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0); const pl=sum(all,'planas'), fk=sum(all,'faktas'), ne=sum(all.filter(b=>b.atsiskaityta===false&&b.faktas),'faktas'), done=all.filter(b=>b.statusas==='Atlikta').length;
    $('ptiles').innerHTML=[['Planas',eur(pl),''],['Faktas',eur(fk),pl?Math.round(fk/pl*100)+' % plano':''],['Skirtumas',eur(pl-fk),pl-fk<0?'viršyta':'rezervas'],['Neatsiskaityta',eur(ne),'faktas be „Atsiskaityta“'],['Atlikta',done+' / '+all.length,'pozicijos']].map(([k,v,s])=>`<div class="tile ${k==='Skirtumas'&&pl-fk<0?'bad':''}"><div class="k">${k}</div><div class="v" style="font-size:18px">${v}</div><div class="s">${s}</div></div>`).join('');
    const rows=all.filter(b=>bzF.show==='all'||(bzF.show==='ne'&&b.atsiskaityta===false)||(bzF.show==='run'&&b.statusas==='Vyksta')||(bzF.show==='over'&&b.planas!=null&&b.faktas!=null&&+b.faktas>+b.planas));
    const fz=[...FZ,...[...new Set(rows.map(r=>r.faze||'Be fazės'))].filter(f=>!FZ.includes(f))];
    const last=src.map(s=>s.paskutinis).filter(Boolean).sort().slice(-1)[0]; const err=src.map(s=>s.klaida).filter(Boolean)[0];
    $('bz').innerHTML=`<div class="mxbar"><div class="seg" id="bzshow">${[['all','Visos'],['run','Vyksta'],['ne','Neatsiskaityta'],['over','Viršija planą']].map(([k,l])=>`<button class="${bzF.show===k?'on':''}" data-k="${k}">${l}</button>`).join('')}</div><span class="mxleg">Šaltinis: Notion · ${src.map(s=>esc(s.pavadinimas)).join(', ')} · ${last?'sinchronizuota '+fdate(last)+' '+String(last).slice(11,16):'dar nesinchronizuota'} · atnaujinama kas 10 min${err?` · <span style="color:var(--bad)">klaida: ${esc(err.slice(0,120))}</span>`:''}</span><a class="ghost" style="margin-left:auto;text-decoration:none" href="https://www.notion.so/${src[0]?.data_source_id?.replace(/-/g,'')||''}" target="_blank">Atidaryti Notion</a></div>`+
      (all.length?`<div class="tablewrap"><table class="bzt"><thead><tr><th>Pozicija</th><th>Firma</th><th>Būsena</th><th>Datos</th><th class="num">Planas</th><th class="num">Faktas</th><th class="num">Skirtumas</th><th>Atsisk.</th><th>Atsakingas</th><th>Bylos</th></tr></thead><tbody>${fz.map(f=>{ const g=rows.filter(r=>(r.faze||'Be fazės')===f); if(!g.length) return ''; const gp=sum(g,'planas'), gf=sum(g,'faktas'); return `<tr class="bzg"><td colspan="4"><b>${esc(f)}</b> <small>${g.length}</small></td><td class="num">${eur(gp)}</td><td class="num">${eur(gf)}</td><td class="num ${gp-gf<0?'neg':''}">${eur(gp-gf)}</td><td colspan="3"></td></tr>`+g.map(r=>{ const d=r.planas!=null&&r.faktas!=null?+r.planas-+r.faktas:null; return `<tr><td><a href="${esc(r.url)}" target="_blank" style="color:inherit;text-decoration:none">${esc(r.pozicija)}</a>${r.pastabos?`<div class="note" style="margin:2px 0 0">${esc(r.pastabos.slice(0,140))}</div>`:''}</td><td>${esc(r.firma||'')}</td><td><span class="pill" style="border-color:${BSC[r.statusas]||'var(--line)'};color:${BSC[r.statusas]||'var(--muted)'}">${esc(r.statusas||'–')}</span></td><td style="white-space:nowrap;font-family:var(--mono);font-size:11px">${r.pradzia?dlt(r.pradzia)+(r.pabaiga&&r.pabaiga!==r.pradzia?' – '+dlt(r.pabaiga):''):''}</td><td class="num">${eur(r.planas)}</td><td class="num">${eur(r.faktas)}</td><td class="num ${d!=null&&d<0?'neg':''}">${d!=null?eur(d):''}</td><td style="text-align:center">${r.atsiskaityta===true?'✓':r.atsiskaityta===false?'<span style="color:var(--bad)">✗</span>':''}</td><td style="font-size:12px">${esc(r.atsakingas||'')}</td><td style="text-align:center">${r.bylos||''}</td></tr>`; }).join(''); }).join('')}</tbody><tfoot><tr class="bzg"><td colspan="4"><b>Iš viso</b></td><td class="num">${eur(sum(rows,'planas'))}</td><td class="num">${eur(sum(rows,'faktas'))}</td><td class="num ${sum(rows,'planas')-sum(rows,'faktas')<0?'neg':''}">${eur(sum(rows,'planas')-sum(rows,'faktas'))}</td><td colspan="3"></td></tr></tfoot></table></div>`:`<div class="note" style="padding:30px;text-align:center">Duomenų dar nėra – laukiama pirmos sinchronizacijos iš Notion${err?': '+esc(err):''}.</div>`);
    $('bz').querySelectorAll('#bzshow button').forEach(b=>b.onclick=()=>{ bzF.show=b.dataset.k; drawBudget(p); }); }
  $('vsw').querySelectorAll('button').forEach(b=>b.onclick=()=>{ view=b.dataset.v; draw(); });

  // ---- modalai
  const modal=(title,bodyHtml,footHtml)=>{ const m=document.createElement('div'); m.className='mback'; m.innerHTML=`<div class="mbox" style="width:min(680px,100%)"><h3>${title}</h3>${bodyHtml}<div class="msg" id="mmsg"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">${footHtml}</div></div>`; document.body.appendChild(m); m.addEventListener('mousedown',e=>{ if(e.target===m) m.remove(); }); return m; };
  const F=(id,l,t='text',v='',x='')=>`<div class="${x}"><label>${l}</label><input id="f_${id}" type="${t}" value="${esc(v)}"></div>`;
  const TA=(id,l,v='')=>`<div class="w"><label>${l}</label><textarea id="f_${id}" rows="3">${esc(v)}</textarea></div>`;
  const SEL=(id,l,o,v,x='')=>`<div class="${x}"><label>${l}</label><select id="f_${id}">${o.map(([a,b])=>`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select></div>`;
  const memberOpts=sel=>[['','–'],...members().map(m=>[m,name(m)])].concat(sel&&!members().includes(sel)?[[sel,name(sel)]]:[]);
  function taskForm(t){ return `<div class="g">${F('pav','Užduotis','text',t.pavadinimas||'','w')}${SEL('pr','Projektas',P.map(p=>[String(p.id),p.pavadinimas]),String(t.projektas_id||cur||P[0]?.id||''))}${SEL('kas','Atsakingas',memberOpts(t.atsakingas),t.atsakingas||'')}${SEL('st','Būsena',COLS,t.busena||'Nauja')}${SEL('pri','Prioritetas',Object.keys(PRC).map(k=>[k,k]),t.prioritetas||'Vidutinis')}${F('term','Terminas','date',t.terminas||'')}${TA('apr','Aprašymas',t.aprasymas||'')}</div>`; }
  const gv=(m,id)=>{ const e=m.querySelector('#f_'+id); return e?e.value.trim():''; };
  function readTask(m){ return {pavadinimas:gv(m,'pav'),projektas_id:+gv(m,'pr')||null,atsakingas:gv(m,'kas')||null,busena:gv(m,'st'),prioritetas:gv(m,'pri'),terminas:gv(m,'term')||null,aprasymas:gv(m,'apr')||null}; }
  function newTask(pre){ const m=modal('Nauja užduotis',taskForm(pre||{}),`<button class="ghost" id="mc">Atšaukti</button><button class="primary" id="ms" style="width:auto;padding:10px 22px">Sukurti</button>`); m.querySelector('#mc').onclick=()=>m.remove();
    m.querySelector('#ms').onclick=async()=>{ const row=readTask(m); if(!row.pavadinimas){ m.querySelector('#mmsg').textContent='Įveskite užduoties pavadinimą.'; return; } row.sukure=ME; try{ const j=await api('uzduotys',{method:'POST',headers:{prefer:'return=representation'},body:JSON.stringify(row)}); T.push(j[0]); m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } }; }
  $('addtask').onclick=()=>newTask();
  async function openTask(id){ const t=T.find(x=>x.id===id); if(!t) return; let C=[]; try{ C=await api('komentarai?select=*&uzduotis_id=eq.'+id+'&order=sukurta'); }catch(e){}
    const m=modal('Užduotis · #'+id,taskForm(t)+`<div class="cmts"><h2>Komentarai</h2><div id="clist">${C.map(c=>`<div class="cmt"><span class="av">${ini(c.autorius)}</span><div><div class="ch"><b>${esc(name(c.autorius))}</b> <small>${fdate(c.sukurta)} ${String(c.sukurta).slice(11,16)}</small></div><div>${esc(c.tekstas)}</div></div></div>`).join('')||'<div class="note">Komentarų nėra.</div>'}</div><div style="display:flex;gap:6px;margin-top:8px"><input type="text" id="f_cm" placeholder="Komentaras…" style="flex:1"><button class="ghost" id="cadd">Siųsti</button></div></div><div class="note">Sukūrė ${esc(name(t.sukure))} · ${fdate(t.sukurta)}${t.baigta?' · atlikta '+fdate(t.baigta):''}</div>`,
      `<button class="delbtn" id="md" style="margin-right:auto">Trinti</button><button class="ghost" id="mc">Atšaukti</button><button class="primary" id="ms" style="width:auto;padding:10px 22px">Išsaugoti</button>`);
    m.querySelector('#mc').onclick=()=>m.remove();
    m.querySelector('#md').onclick=async()=>{ if(!confirm('Ištrinti užduotį?')) return; try{ await api('uzduotys?id=eq.'+id,{method:'DELETE',headers:{prefer:'return=minimal'}}); T=T.filter(x=>x.id!==id); m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } };
    m.querySelector('#ms').onclick=async()=>{ const row=readTask(m); if(!row.pavadinimas){ m.querySelector('#mmsg').textContent='Įveskite pavadinimą.'; return; } try{ const j=await api('uzduotys?id=eq.'+id,{method:'PATCH',headers:{prefer:'return=representation'},body:JSON.stringify(row)}); Object.assign(t,j[0]); m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } };
    const send=async()=>{ const txt=m.querySelector('#f_cm').value.trim(); if(!txt) return; try{ const j=await api('komentarai',{method:'POST',headers:{prefer:'return=representation'},body:JSON.stringify({uzduotis_id:id,autorius:ME,tekstas:txt})}); const c=j[0]; m.querySelector('#clist').insertAdjacentHTML('beforeend',`<div class="cmt"><span class="av">${ini(c.autorius)}</span><div><div class="ch"><b>${esc(name(c.autorius))}</b> <small>${fdate(c.sukurta)} ${String(c.sukurta).slice(11,16)}</small></div><div>${esc(c.tekstas)}</div></div></div>`); const n=m.querySelector('#clist .note'); if(n) n.remove(); m.querySelector('#f_cm').value=''; }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } };
    m.querySelector('#cadd').onclick=send; m.querySelector('#f_cm').onkeydown=e=>{ if(e.key==='Enter') send(); };
  }
  function projForm(p){ return `<div class="g">${F('pav','Pavadinimas','text',p.pavadinimas||'','w')}${F('adr','Adresas','text',p.adresas||'','w')}${F('sav','Savivaldybė','text',p.savivaldybe||'')}${SEL('st','Būsena',Object.keys(PBC).map(k=>[k,k]),p.busena||'Vykdomas')}${F('et','Etapas','text',p.etapas||'')}${SEL('vad','Vadovas',memberOpts(p.vadovas),p.vadovas||ME)}${F('pr','Pradžia','date',p.pradzia||'')}${F('pb','Pabaiga','date',p.pabaiga||'')}${TA('apr','Aprašymas',p.aprasymas||'')}</div>`; }
  const readProj=m=>({pavadinimas:gv(m,'pav'),adresas:gv(m,'adr')||null,savivaldybe:gv(m,'sav')||null,busena:gv(m,'st'),etapas:gv(m,'et')||null,vadovas:gv(m,'vad')||null,pradzia:gv(m,'pr')||null,pabaiga:gv(m,'pb')||null,aprasymas:gv(m,'apr')||null});
  $('addpr').onclick=()=>{ if(!isAdmin()) return; const m=modal('Naujas projektas',projForm({}),`<button class="ghost" id="mc">Atšaukti</button><button class="primary" id="ms" style="width:auto;padding:10px 22px">Sukurti</button>`); m.querySelector('#mc').onclick=()=>m.remove();
    m.querySelector('#ms').onclick=async()=>{ const row=readProj(m); if(!row.pavadinimas){ m.querySelector('#mmsg').textContent='Įveskite pavadinimą.'; return; } row.sukure=ME; try{ const j=await api('projektai',{method:'POST',headers:{prefer:'return=representation'},body:JSON.stringify(row)}); P.push(j[0]); cur=j[0].id; view='matrix'; m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } }; };
  $('editpr').onclick=()=>{ const p=P.find(x=>x.id===cur); if(!p||!isAdmin()) return; const m=modal('Projektas · redagavimas',projForm(p),`<button class="delbtn" id="md" style="margin-right:auto">Trinti projektą</button><button class="ghost" id="mc">Atšaukti</button><button class="primary" id="ms" style="width:auto;padding:10px 22px">Išsaugoti</button>`); m.querySelector('#mc').onclick=()=>m.remove();
    m.querySelector('#md').onclick=async()=>{ if(!confirm(`Ištrinti projektą „${p.pavadinimas}“ su visomis užduotimis?`)) return; try{ await api('projektai?id=eq.'+p.id,{method:'DELETE',headers:{prefer:'return=minimal'}}); P=P.filter(x=>x.id!==p.id); T=T.filter(x=>x.projektas_id!==p.id); cur=null; m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } };
    m.querySelector('#ms').onclick=async()=>{ const row=readProj(m); try{ const j=await api('projektai?id=eq.'+p.id,{method:'PATCH',headers:{prefer:'return=representation'},body:JSON.stringify(row)}); Object.assign(p,j[0]); m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } }; };
  ['f_mano','f_atl','f_kas'].forEach(id=>$(id).addEventListener('change',draw));
  draw();
  // atnaujinimas fone kas 60 s (kolegų pakeitimai)
  setInterval(async()=>{ if(document.querySelector('.mback')) return; try{ const [p,t,pm,b,ns]=await Promise.all([api('projektai?select=*&order=busena,pavadinimas'),api('uzduotys?select=*&order=eile,id'),api('projekto_matrica?select=*'),api('biudzetas?select=*&order=faze,pozicija'),api('notion_saltiniai?select=*')]); if(JSON.stringify(t)!==JSON.stringify(T)||JSON.stringify(p)!==JSON.stringify(P)||JSON.stringify(pm)!==JSON.stringify(PM)||JSON.stringify(b)!==JSON.stringify(B)||JSON.stringify(ns)!==JSON.stringify(NS)){ P=p; T=t; PM=pm; B=b; NS=ns; draw(); } }catch(e){} },60000);
})();
</script></body></html>
