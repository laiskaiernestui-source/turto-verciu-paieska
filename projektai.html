(async function(){

  const SB='https://zbgugliqnjohqbotssgl.supabase.co', KEY='sb_publishable_PpoYli-Lf-OiTJkJVTP15A_fzR58I3D';
  const AK='tv_auth'; let AUTH=null, ROLE=null, ME='';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fdate=d=>d?String(d).slice(0,10):'';
  const today=()=>new Date().toISOString().slice(0,10);
  // ---- auth (bendra su Analitikos įrankiu: tas pats localStorage raktas)
  try{ const m=location.hash.match(/access_token=([^&]+).*?refresh_token=([^&]+)/); const ex=location.hash.match(/expires_in=(\d+)/);
    if(m){ AUTH={access_token:m[1],refresh_token:m[2],exp:Date.now()+(+((ex||[])[1]||3600))*1000}; try{ const pl=JSON.parse(atob(m[1].split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); AUTH.email=pl.email; }catch(e){} localStorage.setItem(AK,JSON.stringify(AUTH)); history.replaceState(null,'',location.pathname+location.search); }
    else AUTH=JSON.parse(localStorage.getItem(AK)||'null'); }catch(e){}
  async function authTok(){ if(!AUTH) return null; if(Date.now()>AUTH.exp-60000){ try{ const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({refresh_token:AUTH.refresh_token})}); const j=await r.json(); if(!j.access_token) throw 0; AUTH={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+j.expires_in*1000,email:AUTH.email}; localStorage.setItem(AK,JSON.stringify(AUTH)); }catch(e){ AUTH=null; localStorage.removeItem(AK); return null; } } return AUTH.access_token; }

      ${AUTH?`<button class="ghost" id="g_out" style="margin-top:14px">Atsijungti (${esc(AUTH.email||'')})</button>`:''}</div>`;
    if(!GATE.isConnected) document.body.appendChild(GATE);
    const back=location.origin+location.pathname;
    GATE.querySelector('#g_ms').onclick=()=>{ location.href=SB+'/auth/v1/authorize?provider=azure&scopes='+encodeURIComponent('email openid profile')+'&redirect_to='+encodeURIComponent(back); };
    const go=GATE.querySelector('#g_out'); if(go) go.onclick=()=>{ AUTH=null; localStorage.removeItem(AK); location.reload(); };
  }
  async function resolveRole(){ const t=await authTok(); if(!t) return null; try{ const r=await fetch(SB+'/rest/v1/rpc/my_role',{method:'POST',headers:{apikey:KEY,authorization:'Bearer '+t,'content-type':'application/json'},body:'{}'}); if(!r.ok) return null; const j=await r.json(); return (typeof j==='string'&&j)?j:null; }catch(e){ return null; } }
  const isAdmin=()=>ROLE==='admin';
  function paintAuth(){ $('who').textContent=AUTH?((AUTH.email||'')+(ROLE?' · '+(ROLE==='admin'?'administratorius':'narys'):'')):''; $('login').textContent=AUTH?'Atsijungti':'Prisijungti'; document.body.classList.toggle('admin',ROLE==='admin'); }
  $('login').onclick=()=>{ if(AUTH){ AUTH=null; localStorage.removeItem(AK); location.reload(); } else showGate(); };
  paintAuth();
  { const er=location.hash.match(/error_description=([^&]+)/); if(er){ history.replaceState(null,'',location.pathname); showGate('Prisijungti nepavyko: '+decodeURIComponent(er[1].replace(/\+/g,' '))); $('meta').textContent=''; return; } }
  if(!AUTH){ showGate(); $('meta').textContent=''; return; }
  ROLE=await resolveRole();
  if(!ROLE){ showGate(`Paskyrai <b>${esc(AUTH.email||'')}</b> prieiga nesuteikta.`); $('meta').textContent=''; return; }
  ME=(AUTH.email||'').toLowerCase(); paintAuth();

  // ---- duomenys
  let P=[], T=[], N=[], M=[], PM=[], cur=null, view='tasks'; // projektai, uzduotys, nariai, pasirinktas projektas
  const api=async(path,opt={})=>{ const r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:await H(opt.headers||{})}); if(!r.ok) throw new Error((await r.text()).slice(0,200)); const t=await r.text(); return t?JSON.parse(t):null; };
  async function load(){ [P,T,N,M,PM]=await Promise.all([api('projektai?select=*&order=busena,pavadinimas'),api('uzduotys?select=*&order=eile,id'),api('rpc/nariai',{method:'POST',body:'{}'}),api('matrica_sablonas?select=*&order=eil'),api('projekto_matrica?select=*')]); $('meta').textContent=''; }
  try{ await load(); }catch(e){ $('meta').textContent='Nepavyko užkrauti: '+e.message; return; }
  const name=e=>{ if(!e) return '–'; const l=String(e).split('@')[0]; return l.charAt(0).toUpperCase()+l.slice(1); };
  const ini=e=>e?String(e).split('@')[0].slice(0,2).toUpperCase():'?';
  const COLS=[['Nauja','Nauja'],['Vykdoma','Vykdoma'],['Laukia','Laukia'],['Atlikta','Atlikta']];
  const PRC={'Žemas':'var(--muted)','Vidutinis':'#2f6fd0','Aukštas':'#c47a00','Kritinis':'#a84a3a'};
  const PBC={'Planuojamas':'#2f6fd0','Vykdomas':'#1a9a4a','Sustabdytas':'#c47a00','Užbaigtas':'#8a8a8a'};
  const members=()=>{ const s=new Set(N.map(n=>n.email.toLowerCase())); T.forEach(t=>{ if(t.atsakingas) s.add(t.atsakingas.toLowerCase()); }); return [...s].sort(); };
  function fillKas(){ const cur=$('f_kas').value; $('f_kas').innerHTML='<option value="">Visi</option>'+members().map(m=>`<option value="${esc(m)}">${esc(name(m))}</option>`).join(''); $('f_kas').value=cur; }
  const tasksOf=pid=>T.filter(t=>pid==null||t.projektas_id===pid);
  const visible=()=>tasksOf(cur).filter(t=>(!$('f_mano').checked||(t.atsakingas||'').toLowerCase()===ME)&&($('f_atl').checked||t.busena!=='Atlikta')&&(!$('f_kas').value||(t.atsakingas||'').toLowerCase()===$('f_kas').value));
  function drawList(){
    const all=T.length, allOpen=T.filter(t=>t.busena!=='Atlikta').length;
    $('plist').innerHTML=`<div class="pitem ${cur==null?'on':''}" data-id=""><b>Visi projektai</b><small>${allOpen} atvirų · ${all} iš viso</small></div>`+P.map(p=>{ const ts=tasksOf(p.id); const open=ts.filter(t=>t.busena!=='Atlikta').length; const late=ts.filter(t=>t.busena!=='Atlikta'&&t.terminas&&t.terminas<today()).length; return `<div class="pitem ${cur===p.id?'on':''}" data-id="${p.id}"><b>${esc(p.pavadinimas)}</b><small><span class="pill" style="border-color:${PBC[p.busena]};color:${PBC[p.busena]}">${esc(p.busena)}</span> ${p.etapas?esc(p.etapas)+' · ':''}${open} atvirų${late?` · <span style="color:#a84a3a">${late} vėluoja</span>`:''}</small></div>`; }).join('');
    $('plist').querySelectorAll('.pitem').forEach(el=>el.onclick=()=>{ cur=el.dataset.id?+el.dataset.id:null; view=cur?'matrix':'tasks'; draw(); });
  }
  function draw(){
    drawList(); fillKas();
    const p=P.find(x=>x.id===cur);
    $('ptitle').textContent=p?p.pavadinimas:'Visi projektai'; $('psub').innerHTML=p?`${esc(p.adresas||'')}${p.etapas?' · '+esc(p.etapas):''}${p.vadovas?' · vadovas '+esc(name(p.vadovas)):''}${p.aprasymas?`<div style="margin-top:4px;max-width:900px">${esc(p.aprasymas)}</div>`:''}`:'';
    $('editpr').style.display=p&&isAdmin()?'':'none';
    $('vsw').style.display=p?'':'none'; if(!p) view='tasks'; $('vsw').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
    if(view==='matrix'){ $('board').style.display='none'; $('mx').style.display=''; drawMatrix(p); return; } $('board').style.display=''; $('mx').style.display='none';
    const vs=visible(); const open=vs.filter(t=>t.busena!=='Atlikta'); const late=open.filter(t=>t.terminas&&t.terminas<today()); const week=open.filter(t=>t.terminas&&t.terminas>=today()&&t.terminas<=new Date(Date.now()+7*864e5).toISOString().slice(0,10)); const mine=open.filter(t=>(t.atsakingas||'').toLowerCase()===ME);
    $('ptiles').innerHTML=[['Atviros užduotys',open.length,''],['Vėluoja',late.length,late.length?'terminas praėjo':''],['Šią savaitę',week.length,'terminas per 7 d.'],['Mano',mine.length,'priskirta man']].map(([k,v,s])=>`<div class="tile ${k==='Vėluoja'&&v?'bad':''}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
    $('board').innerHTML=COLS.map(([k,l])=>{ const ts=vs.filter(t=>t.busena===k); return `<div class="col" data-st="${k}"><div class="colh">${l} <span>${ts.length}</span></div><div class="cards" data-st="${k}">${ts.map(card).join('')}</div></div>`; }).join('');
    $('board').querySelectorAll('.card').forEach(c=>{ c.onclick=()=>openTask(+c.dataset.id); c.ondragstart=e=>{ e.dataTransfer.setData('text/plain',c.dataset.id); c.classList.add('drag'); }; c.ondragend=()=>c.classList.remove('drag'); });
    $('board').querySelectorAll('.cards').forEach(z=>{ z.ondragover=e=>{ e.preventDefault(); z.classList.add('over'); }; z.ondragleave=()=>z.classList.remove('over'); z.ondrop=async e=>{ e.preventDefault(); z.classList.remove('over'); const id=+e.dataTransfer.getData('text/plain'); const t=T.find(x=>x.id===id); if(!t||t.busena===z.dataset.st) return; const old=t.busena; t.busena=z.dataset.st; draw(); try{ await api('uzduotys?id=eq.'+id,{method:'PATCH',headers:{prefer:'return=minimal'},body:JSON.stringify({busena:z.dataset.st})}); }catch(err){ t.busena=old; draw(); alert('Nepavyko: '+err.message); } }; });
  }
  const card=t=>{ const p=P.find(x=>x.id===t.projektas_id); const late=t.busena!=='Atlikta'&&t.terminas&&t.terminas<today(); return `<div class="card" draggable="true" data-id="${t.id}"><div class="ct">${esc(t.pavadinimas)}</div>${cur==null&&p?`<div class="cp">${esc(p.pavadinimas)}</div>`:''}<div class="cm"><span class="av" title="${esc(t.atsakingas||'')}">${ini(t.atsakingas)}</span><span>${esc(name(t.atsakingas))}</span>${t.terminas?`<span class="due ${late?'late':''}">${fdate(t.terminas)}</span>`:''}<span class="pri" style="color:${PRC[t.prioritetas]||'var(--muted)'}">${esc(t.prioritetas||'')}</span></div></div>`; };

  // ---- atsakomybių matrica (V vykdo · K kontroliuoja · S stebi)
  const MST=[['nepradėta','Nepradėta'],['vykdoma','Vykdoma'],['atlikta','Atlikta'],['netaikoma','Netaikoma']];
  const person=k=>{ const pre={e:'ernest',j:'justin',d:'dom'}[k]; return members().find(m=>m.startsWith(pre))||null; };
  const PN={e:'Ernestas',j:'Justinas',d:'Domas'};
  const pmOf=(pid,sid)=>PM.find(x=>x.projektas_id===pid&&x.sablonas_id===sid);
  const roleChip=(k,r,who)=>`<span class="rc r${r}" title="${PN[k]} – ${r==='V'?'vykdo':r==='K'?'kontroliuoja':'stebi'}">${PN[k].slice(0,1)}<small>${r}</small></span>`;
  function drawMatrix(p){
    const rows=M.map(m=>({...m,st:(pmOf(p.id,m.id)||{}).busena||'nepradėta'}));
    const act=rows.filter(r=>r.st!=='netaikoma'); const done=act.filter(r=>r.st==='atlikta').length, run=act.filter(r=>r.st==='vykdoma').length;
    const myK=rows.filter(r=>r.st!=='atlikta'&&r.st!=='netaikoma'&&['e','j','d'].some(k=>r[k]==='V'&&(person(k)===ME||(k==='e'&&ME.startsWith('laiskai'))))).length;
    $('ptiles').innerHTML=[['Atlikta',done+' / '+act.length,act.length?Math.round(done/act.length*100)+' %':''],['Vykdoma',run,''],['Mano (vykdau)',myK,'neatlikti darbai'],['Etapų',[...new Set(rows.map(r=>r.etapas_nr))].length,'']].map(([k,v,s])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
    const groups=[]; rows.forEach(r=>{ let g=groups.find(x=>x.n===r.etapas_nr); if(!g){ g={n:r.etapas_nr,t:r.etapas,rows:[]}; groups.push(g); } g.rows.push(r); });
    const openSet=drawMatrix.open||(drawMatrix.open=new Set(groups.filter(g=>g.rows.some(r=>r.st==='vykdoma')).map(g=>g.n)));
    $('mx').innerHTML=`<div class="mxleg"><span class="rc rV">V</span> vykdo <span class="rc rK">K</span> kontroliuoja <span class="rc rS">S</span> stebi</div>`+groups.map(g=>{ const a=g.rows.filter(r=>r.st!=='netaikoma'); const d=a.filter(r=>r.st==='atlikta').length; const pct=a.length?Math.round(d/a.length*100):0; const op=openSet.has(g.n);
      return `<div class="mxg ${op?'open':''}"><div class="mxh" data-n="${g.n}"><span class="mxn">${g.n}</span><b>${esc(g.t)}</b><span class="mxp"><i style="width:${pct}%"></i></span><small>${d}/${a.length}</small><span class="mxc">${op?'−':'+'}</span></div>
      <table class="mxt" ${op?'':'style="display:none"'}>${g.rows.map(r=>`<tr class="st-${r.st}"><td class="nr">${esc(r.nr)}</td><td>${esc(r.darbas)}</td><td class="rr">${roleChip('e',r.e)}${roleChip('j',r.j)}${roleChip('d',r.d)}</td><td><select data-id="${r.id}" class="mxs">${MST.map(([a,b])=>`<option value="${a}" ${a===r.st?'selected':''}>${b}</option>`).join('')}</select></td><td><button class="ghost mxb" data-id="${r.id}" title="Sukurti užduotį iš šio darbo">+ užduotis</button></td></tr>`).join('')}</table></div>`; }).join('');
    $('mx').querySelectorAll('.mxh').forEach(h=>h.onclick=()=>{ const n=+h.dataset.n; openSet.has(n)?openSet.delete(n):openSet.add(n); drawMatrix(p); });
    $('mx').querySelectorAll('.mxs').forEach(s=>s.onchange=async()=>{ const sid=+s.dataset.id; const row={projektas_id:p.id,sablonas_id:sid,busena:s.value,atnaujino:ME,atnaujinta:new Date().toISOString()}; let e=pmOf(p.id,sid); const old=e?{...e}:null; if(e) Object.assign(e,row); else PM.push(row); try{ await api('projekto_matrica?on_conflict=projektas_id,sablonas_id',{method:'POST',headers:{prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)}); drawMatrix(p); }catch(err){ if(old) Object.assign(e,old); else PM=PM.filter(x=>x!==row); drawMatrix(p); alert('Nepavyko: '+err.message); } });
    $('mx').querySelectorAll('.mxb').forEach(b=>b.onclick=()=>{ const r=M.find(x=>x.id===+b.dataset.id); const vk=['e','j','d'].find(k=>r[k]==='V'); newTask({pavadinimas:r.nr+' '+r.darbas,projektas_id:p.id,atsakingas:person(vk)||'',aprasymas:'Etapas: '+r.etapas+'\nVykdo: '+PN[vk]+' · kontroliuoja: '+['e','j','d'].filter(k=>r[k]==='K').map(k=>PN[k]).join(', ')}); });
  }
  $('vsw').querySelectorAll('button').forEach(b=>b.onclick=()=>{ view=b.dataset.v; draw(); });

  // ---- modalai
  const modal=(title,bodyHtml,footHtml)=>{ const m=document.createElement('div'); m.className='mback'; m.innerHTML=`<div class="mbox" style="width:min(680px,100%)"><h3>${title}</h3>${bodyHtml}<div class="msg" id="mmsg"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">${footHtml}</div></div>`; document.body.appendChild(m); m.addEventListener('mousedown',e=>{ if(e.target===m) m.remove(); }); return m; };
  const F=(id,l,t='text',v='',x='')=>`<div class="${x}"><label>${l}</label><input id="f_${id}" type="${t}" value="${esc(v)}"></div>`;
  const TA=(id,l,v='')=>`<div class="w"><label>${l}</label><textarea id="f_${id}" rows="3">${esc(v)}</textarea></div>`;
  const SEL=(id,l,o,v,x='')=>`<div class="${x}"><label>${l}</label><select id="f_${id}">${o.map(([a,b])=>`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select></div>`;
  const memberOpts=sel=>[['','–'],...members().map(m=>[m,name(m)])].concat(sel&&!members().includes(sel)?[[sel,name(sel)]]:[]);
  function taskForm(t){ return `<div class="g">${F('pav','Užduotis','text',t.pavadinimas||'','w')}${SEL('pr','Projektas',P.map(p=>[String(p.id),p.pavadinimas]),String(t.projektas_id||cur||P[0]?.id||''))}${SEL('kas','Atsakingas',memberOpts(t.atsakingas),t.atsakingas||'')}${SEL('st','Būsena',COLS,t.busena||'Nauja')}${SEL('pri','Prioritetas',Object.keys(PRC).map(k=>[k,k]),t.prioritetas||'Vidutinis')}${F('term','Terminas','date',t.terminas||'')}${TA('apr','Aprašymas',t.aprasymas||'')}</div>`; }
  const gv=(m,id)=>{ const e=m.querySelector('#f_'+id); return e?e.value.trim():''; };
  function readTask(m){ return {pavadinimas:gv(m,'pav'),projektas_id:+gv(m,'pr')||null,atsakingas:gv(m,'kas')||null,busena:gv(m,'st'),prioritetas:gv(m,'pri'),terminas:gv(m,'term')||null,aprasymas:gv(m,'apr')||null}; }
  function newTask(pre){ const m=modal('Nauja užduotis',taskForm(pre||{}),`<button class="ghost" id="mc">Atšaukti</button><button class="primary" id="ms" style="width:auto;padding:10px 22px">Sukurti</button>`); m.querySelector('#mc').onclick=()=>m.remove();
    m.querySelector('#ms').onclick=async()=>{ const row=readTask(m); if(!row.pavadinimas){ m.querySelector('#mmsg').textContent='Įveskite užduoties pavadinimą.'; return; } row.sukure=ME; try{ const j=await api('uzduotys',{method:'POST',headers:{prefer:'return=representation'},body:JSON.stringify(row)}); T.push(j[0]); m.remove(); view='tasks'; draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } }; }
  $('addtask').onclick=()=>newTask();
  async function openTask(id){ const t=T.find(x=>x.id===id); if(!t) return; let C=[]; try{ C=await api('komentarai?select=*&uzduotis_id=eq.'+id+'&order=sukurta'); }catch(e){}
    const m=modal('Užduotis · #'+id,taskForm(t)+`<div class="cmts"><h2>Komentarai</h2><div id="clist">${C.map(c=>`<div class="cmt"><span class="av">${ini(c.autorius)}</span><div><div class="ch"><b>${esc(name(c.autorius))}</b> <small>${fdate(c.sukurta)} ${String(c.sukurta).slice(11,16)}</small></div><div>${esc(c.tekstas)}</div></div></div>`).join('')||'<div class="note">Komentarų nėra.</div>'}</div><div style="display:flex;gap:6px;margin-top:8px"><input type="text" id="f_cm" placeholder="Komentaras…" style="flex:1"><button class="ghost" id="cadd">Siųsti</button></div></div><div class="note">Sukūrė ${esc(name(t.sukure))} · ${fdate(t.sukurta)}${t.baigta?' · atlikta '+fdate(t.baigta):''}</div>`,
      `<button class="delbtn" id="md" style="margin-right:auto">Trinti</button><button class="ghost" id="mc">Atšaukti</button><button class="primary" id="ms" style="width:auto;padding:10px 22px">Išsaugoti</button>`);
    m.querySelector('#mc').onclick=()=>m.remove();
    m.querySelector('#md').onclick=async()=>{ if(!confirm('Ištrinti užduotį?')) return; try{ await api('uzduotys?id=eq.'+id,{method:'DELETE',headers:{prefer:'return=minimal'}}); T=T.filter(x=>x.id!==id); m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } };
    m.querySelector('#ms').onclick=async()=>{ const row=readTask(m); if(!row.pavadinimas){ m.querySelector('#mmsg').textContent='Įveskite pavadinimą.'; return; } try{ const j=await api('uzduotys?id=eq.'+id,{method:'PATCH',headers:{prefer:'return=representation'},body:JSON.stringify(row)}); Object.assign(t,j[0]); m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } };
    const send=async()=>{ const txt=m.querySelector('#f_cm').value.trim(); if(!txt) return; try{ const j=await api('komentarai',{method:'POST',headers:{prefer:'return=representation'},body:JSON.stringify({uzduotis_id:id,autorius:ME,tekstas:txt})}); const c=j[0]; m.querySelector('#clist').insertAdjacentHTML('beforeend',`<div class="cmt"><span class="av">${ini(c.autorius)}</span><div><div class="ch"><b>${esc(name(c.autorius))}</b> <small>${fdate(c.sukurta)} ${String(c.sukurta).slice(11,16)}</small></div><div>${esc(c.tekstas)}</div></div></div>`); const n=m.querySelector('#clist .note'); if(n) n.remove(); m.querySelector('#f_cm').value=''; }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } };
    m.querySelector('#cadd').onclick=send; m.querySelector('#f_cm').onkeydown=e=>{ if(e.key==='Enter') send(); };
  }
  function projForm(p){ return `<div class="g">${F('pav','Pavadinimas','text',p.pavadinimas||'','w')}${F('adr','Adresas','text',p.adresas||'','w')}${F('sav','Savivaldybė','text',p.savivaldybe||'')}${SEL('st','Būsena',Object.keys(PBC).map(k=>[k,k]),p.busena||'Vykdomas')}${F('et','Etapas','text',p.etapas||'')}${SEL('vad','Vadovas',memberOpts(p.vadovas),p.vadovas||ME)}${F('pr','Pradžia','date',p.pradzia||'')}${F('pb','Pabaiga','date',p.pabaiga||'')}${TA('apr','Aprašymas',p.aprasymas||'')}</div>`; }
  const readProj=m=>({pavadinimas:gv(m,'pav'),adresas:gv(m,'adr')||null,savivaldybe:gv(m,'sav')||null,busena:gv(m,'st'),etapas:gv(m,'et')||null,vadovas:gv(m,'vad')||null,pradzia:gv(m,'pr')||null,pabaiga:gv(m,'pb')||null,aprasymas:gv(m,'apr')||null});
  $('addpr').onclick=()=>{ if(!isAdmin()) return; const m=modal('Naujas projektas',projForm({}),`<button class="ghost" id="mc">Atšaukti</button><button class="primary" id="ms" style="width:auto;padding:10px 22px">Sukurti</button>`); m.querySelector('#mc').onclick=()=>m.remove();
    m.querySelector('#ms').onclick=async()=>{ const row=readProj(m); if(!row.pavadinimas){ m.querySelector('#mmsg').textContent='Įveskite pavadinimą.'; return; } row.sukure=ME; try{ const j=await api('projektai',{method:'POST',headers:{prefer:'return=representation'},body:JSON.stringify(row)}); P.push(j[0]); cur=j[0].id; view='matrix'; m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } }; };
  $('editpr').onclick=()=>{ const p=P.find(x=>x.id===cur); if(!p||!isAdmin()) return; const m=modal('Projektas · redagavimas',projForm(p),`<button class="delbtn" id="md" style="margin-right:auto">Trinti projektą</button><button class="ghost" id="mc">Atšaukti</button><button class="primary" id="ms" style="width:auto;padding:10px 22px">Išsaugoti</button>`); m.querySelector('#mc').onclick=()=>m.remove();
    m.querySelector('#md').onclick=async()=>{ if(!confirm(`Ištrinti projektą „${p.pavadinimas}“ su visomis užduotimis?`)) return; try{ await api('projektai?id=eq.'+p.id,{method:'DELETE',headers:{prefer:'return=minimal'}}); P=P.filter(x=>x.id!==p.id); T=T.filter(x=>x.projektas_id!==p.id); cur=null; m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } };
    m.querySelector('#ms').onclick=async()=>{ const row=readProj(m); try{ const j=await api('projektai?id=eq.'+p.id,{method:'PATCH',headers:{prefer:'return=representation'},body:JSON.stringify(row)}); Object.assign(p,j[0]); m.remove(); draw(); }catch(e){ m.querySelector('#mmsg').textContent='Nepavyko: '+e.message; } }; };
  ['f_mano','f_atl','f_kas'].forEach(id=>$(id).addEventListener('change',draw));
  draw();
  // atnaujinimas fone kas 60 s (kolegų pakeitimai)
  setInterval(async()=>{ if(document.querySelector('.mback')) return; try{ const [p,t,pm]=await Promise.all([api('projektai?select=*&order=busena,pavadinimas'),api('uzduotys?select=*&order=eile,id'),api('projekto_matrica?select=*')]); if(JSON.stringify(t)!==JSON.stringify(T)||JSON.stringify(p)!==JSON.stringify(P)||JSON.stringify(pm)!==JSON.stringify(PM)){ P=p; T=t; PM=pm; draw(); } }catch(e){} },60000);
})();

</script></body></html>
